# Kamal deploy to the same Hetzner VPS as real-calc (its own container behind the shared kamal-proxy).
# Run through bin/prod, which loads .env.production (KAMAL_HOST, KAMAL_REGISTRY_PASSWORD, ADMIN_PASSWORD).
<% host = ENV.fetch("KAMAL_HOST") { abort "Set KAMAL_HOST to the server's IP" } %>
service: lyndbergh-platform
image: lsimelus/lyndbergh-platform

servers:
  web:
    - <%= host %>

proxy:
  host: platform.lyndbergh.net
  ssl: true          # Let's Encrypt certificate, renewed by kamal-proxy
  healthcheck:
    path: /up

registry:
  server: ghcr.io
  username: Lsimelus
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64        # Hetzner cx23 (x86)
  remote: ssh://root@<%= host %>

env:
  clear:
    SOLID_QUEUE_IN_PUMA: true   # site checks and the nightly backup run inside the web container
  secret:
    - RAILS_MASTER_KEY
    - ADMIN_PASSWORD
    - ALERT_URL
    - TRAFFIC_TOKEN    # script/traffic-collector's bearer token for POST /api/traffic

# SQLite databases and their nightly backups (storage/backups) live in this Docker volume.
volumes:
  - "lyndbergh_platform_storage:/rails/storage"

asset_path: /rails/public/assets

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
