# Every site the platform monitors. `health_path` defaults to /.
# `expect: json` marks the check down unless the response is JSON (catches a host
# serving its HTML page where the API should be). `traffic` links to where that site's
# requests and errors live (Vercel Web Analytics, or New Relic for the apps on the server). Optional `admin` links to the product's
# own admin (it signs people in itself; this page only links to it).
- slug: portfolio
  name: Portfolio
  url: https://www.lyndbergh.net
  repo: Lsimelus/Portfolio
  traffic: https://vercel.com/d?to=%2F%5Bteam%5D%2Fportfolio%2Fanalytics&title=Open+Portfolio+analytics

- slug: real-calc
  name: Real Calc
  url: https://realcalc.lyndbergh.net
  health_path: /health
  repo: Lsimelus/real-calc
  traffic: https://one.newrelic.com/nr1-core
  expect: json

- slug: abchealth
  name: ABCHealth
  url: https://abchealth.lyndbergh.net
  admin: https://abchealth.lyndbergh.net/admin/
  health_path: /api/health
  repo: Lsimelus/abchealth-expressjs
  traffic: https://one.newrelic.com/nr1-core
  expect: json
