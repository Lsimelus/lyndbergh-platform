openapi: 3.1.0
info:
  title: ABCHealth API
  version: 1.0.0
  description: |
    Served by `abchealth-expressjs` (Express + Passport sessions), called by its web pages.
    The iOS app (`abchealth-swiftapp`) talks to Supabase directly today; the generated
    Swift client (`ABCHealthAPI`) is ready for when it calls this server.

    Note: this API predates the shared envelope and returns plain JSON with
    `{ "error": "<message>" }` on failure. New endpoints should use the envelope
    (contracts/common/envelope.yaml); migrate the old ones as a breaking change.
servers:
  - url: https://abchealth-expressjs.vercel.app
    description: Production
  - url: http://localhost:3000
    description: Local
tags:
  - name: health
  - name: auth
  - name: publisher

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Express session cookie set by the Google sign-in callback

  responses:
    Unauthorized:
      description: Sign in required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LegacyError" }
    Forbidden:
      description: Publishers only
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LegacyError" }
    ServerError:
      description: Unexpected failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LegacyError" }

  schemas:
    LegacyError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Message for people

    Role:
      type: string
      enum: [member, publisher]

    Health:
      type: object
      required: [status, message, timestamp]
      properties:
        status: { const: ok }
        message: { type: string }
        timestamp: { type: string, format: date-time }

    CurrentUser:
      type: object
      required: [id, name, email, role, referralCode, referralCount]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: [string, "null"] }
        foundingMemberNumber: { type: [integer, "null"] }
        referralCode: { type: string }
        referralCount: { type: integer }
        role: { $ref: "#/components/schemas/Role" }

    Me:
      oneOf:
        - type: object
          required: [authenticated, user]
          properties:
            authenticated: { const: true }
            user: { $ref: "#/components/schemas/CurrentUser" }
        - type: object
          required: [authenticated, user]
          properties:
            authenticated: { const: false }
            user: { type: "null" }

    EmailJob:
      type: object
      required: [id, triggered_by, recipient_count, status, created_at]
      properties:
        id: { type: integer }
        triggered_by:
          type: string
          description: "`schedule` or `manual:<email>`"
        recipient_count: { type: integer }
        status: { type: string }
        created_at: { type: string, format: date-time }

    PublisherUser:
      type: object
      required: [id, name, email, role, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        founding_member_number: { type: [integer, "null"] }
        referral_code: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/Role" }
        referred_by: { type: [integer, "null"] }
        created_at: { type: string, format: date-time }

paths:
  /api/health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in user, if any
      responses:
        "200":
          description: Always 200; `authenticated` says whether there is a session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      security: [{ session: [] }]
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { const: true }

  /api/publisher/email-job/run:
    post:
      operationId: runEmailJob
      tags: [publisher]
      summary: Run the email job now
      security: [{ session: [] }]
      responses:
        "200":
          description: Job ran
          content:
            application/json:
              schema:
                type: object
                required: [success, job]
                properties:
                  success: { const: true }
                  job: { $ref: "#/components/schemas/EmailJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/publisher/email-job/history:
    get:
      operationId: listEmailJobs
      tags: [publisher]
      summary: Last 50 email jobs, newest first
      security: [{ session: [] }]
      responses:
        "200":
          description: Job history
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/EmailJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/publisher/users:
    get:
      operationId: listUsers
      tags: [publisher]
      summary: All users, by founding member number
      security: [{ session: [] }]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/PublisherUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
